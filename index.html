<!doctype html>
<html lang="pt-BR" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2ece0" id="themeColor">
<title>TreinoHoje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TreinoHoje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Papéis de cor (iguais nos dois temas):
   neutros = estrutura e texto · brand (verde oliva) = marca e seleção · action (tijolo) = só ação e alerta */
:root, :root[data-theme="claro"]{
  --bg:#f2ece0;--surface:#faf7f0;--field:#f2ece0;--ink:#24221e;--muted:#68625a;--line:#e2dacb;--rule:#d1c7b4;
  --brand:#4b5a2e;--brand-soft:#e4e7d3;--brand-ink:#faf7f0;
  --action:#a63b2c;--action-ink:#faf7f0;--action-soft:#f3e1db;--action-text:#8a2f22;
}
:root[data-theme="escuro"]{
  --bg:#1c1c1b;--surface:#262624;--field:#1f1f1e;--ink:#ece8df;--muted:#a8a399;--line:#363532;--rule:#47453f;
  --brand:#b5c48a;--brand-soft:#2b3022;--brand-ink:#1c1c1b;
  --action:#b2402f;--action-ink:#f7f3ea;--action-soft:#382622;--action-text:#eeaa9d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:var(--muted);opacity:.6}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.disp{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ---------- topo ---------- */
.top{max-width:1040px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:36px;line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.marca span{color:var(--brand)}
.tema{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);flex:none}
.tema button{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:0 12px;height:34px;font-size:13px;font-weight:600;background:transparent;color:var(--muted)}
.tema button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tema svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* menu: embaixo no celular, no topo no PC */
nav.menu{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom)}
nav.menu .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
nav.menu button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-top:2px solid transparent;background:none;
  padding:9px 0 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;color:var(--muted)}
nav.menu button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.menu button.on{color:var(--ink);border-top-color:var(--brand)}

main{max-width:1040px;margin:0 auto;padding:8px 16px 32px}

/* ---------- blocos ---------- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.seg button{position:relative;border:0;border-radius:7px;height:44px;background:transparent;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg .dot{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.seg button.on .dot{background:var(--brand-ink)}

.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rot{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
h1{font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;margin-top:4px}
.foco{font-family:"Big Shoulders Display",sans-serif;font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cal{flex:none;width:58px;border-radius:8px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--surface)}
.cal .m{padding:3px 0 2px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--bg)}
.cal .d{padding:5px 0 0;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:30px;line-height:1}
.cal .w{padding:1px 0 6px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.sec{display:flex;justify-content:space-between;gap:8px;margin:20px 0 12px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{border-radius:10px;padding:16px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.lista-ex{display:block}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-head h2{font-size:16px;font-weight:600;line-height:1.3}
.ex-meta{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;color:var(--brand)}
.ultima{font-size:13px;color:var(--muted);margin-top:4px}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--action-soft);color:var(--action-text)}
.hint svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sets{display:grid;gap:6px;margin-top:14px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.set .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.field{position:relative;display:block}
.field input{width:100%;height:46px;border-radius:6px;padding:0 44px 0 12px;font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;
  border:1px solid var(--line);background:var(--field);color:var(--ink)}
.field input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.field small{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);pointer-events:none}
label.lb{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{display:block;width:100%;height:56px;margin-top:4px;border:0;border-radius:10px;background:var(--action);color:var(--action-ink);
  font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.btn:active{transform:translateY(1px)}
.btn.sec-btn{background:transparent;border:1px solid var(--rule);color:var(--ink);font-size:18px;height:50px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--field);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pace{margin-top:14px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
.pace b{margin-left:6px;font-size:18px;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.stat b{display:block;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:34px;line-height:1}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{border-radius:8px;padding:8px 0;text-align:center;border:1px solid var(--line);background:var(--surface)}
.dia small{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;color:var(--muted)}
.dia b{display:block;height:24px;line-height:24px;font-family:"Big Shoulders Display",sans-serif;font-weight:800;font-size:20px;color:var(--brand)}
.dia b.r{color:var(--ink)}
.dia.hj{border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:13px}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.num{text-align:right}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px;width:80px}
.bar i{display:block;height:100%;background:var(--brand)}

details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
details.card summary::-webkit-details-marker{display:none}
.h-tit{font-weight:600}
.h-data{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.h-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.h-body p{margin-bottom:8px}
.h-body p span{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px}
.del{margin-top:6px;background:none;border:0;color:var(--action-text);font-size:13px;font-weight:600;padding:6px 0}
.plano li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.plano li:last-child{border-bottom:0}
.plano li span{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brand)}
.txt p{font-size:15px;margin-bottom:10px}
.txt p:last-child{margin-bottom:0}
.txt b{font-weight:600}
.vazio{color:var(--muted);font-size:15px;padding:32px 0;text-align:center}
.instalar{display:none}
.plano-grid{display:block}

.toast{position:fixed;z-index:9;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-family:"IBM Plex Mono",monospace;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:400px){
  .marca{font-size:32px}
  .tema button{padding:0 9px;gap:5px}
}
/* ---------- PC ---------- */
@media (min-width:900px){
  body{padding-bottom:0}
  .top{padding:28px 24px 16px;border-bottom:1px solid var(--line);max-width:none;
    padding-left:max(24px, calc((100% - 1040px) / 2 + 24px));padding-right:max(24px, calc((100% - 1040px) / 2 + 24px))}
  nav.menu{position:static;background:transparent;border:0;padding:0;margin-right:auto;margin-left:40px}
  nav.menu .in{display:flex;gap:28px;max-width:none}
  nav.menu button{flex-direction:row;gap:8px;font-size:13px;border-top:0;border-bottom:2px solid transparent;padding:10px 0}
  nav.menu button.on{border-bottom-color:var(--brand)}
  nav.menu button svg{width:18px;height:18px}
  main{padding:28px 24px 48px}
  .seg{max-width:440px}
  h1{font-size:44px}
  .foco{font-size:24px}
  .lista-ex{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .lista-ex .card{margin-bottom:0}
  .btn{max-width:340px;margin-top:20px}
  .plano-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  .stats,.dias{max-width:640px}
  .toast{bottom:32px}
}
</style>
</head>
<body>
<header class="top">
  <div class="marca">Treino<span>Hoje</span></div>
  <nav class="menu" aria-label="Seções"><div class="in">
    <button data-aba="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Hoje</button>
    <button data-aba="semana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Semana</button>
    <button data-aba="historico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
    <button data-aba="plano"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Plano</button>
  </div></nav>
  <div class="tema" role="group" aria-label="Aparência">
    <button type="button" data-tema="claro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
    <button type="button" data-tema="escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Escuro</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   PLANO — edite aqui para mudar exercícios, séries e faixas.
   reps: [mínimo, máximo] da faixa de repetições.
   ========================================================= */
const PLANO = {
  A: { nome: 'Treino A', foco: 'Peito, ombro e tríceps', ex: [
    { id: 'supino-reto',      nome: 'Supino reto (barra)',               series: 3, reps: [6, 10] },
    { id: 'supino-inclinado', nome: 'Supino inclinado (halteres)',       series: 2, reps: [8, 12] },
    { id: 'desenvolvimento',  nome: 'Desenvolvimento (halteres)',        series: 2, reps: [8, 12] },
    { id: 'elevacao-lateral', nome: 'Elevação lateral',                  series: 3, reps: [12, 20] },
    { id: 'triceps-frances',  nome: 'Tríceps francês (polia ou halter)', series: 2, reps: [10, 15] },
    { id: 'triceps-pulley',   nome: 'Tríceps pulley (corda)',            series: 2, reps: [10, 15] },
  ]},
  B: { nome: 'Treino B', foco: 'Costas e bíceps', ex: [
    { id: 'barra-fixa',        nome: 'Barra fixa (ou puxada alta)',    series: 3, reps: [5, 10], obs: 'peso = lastro, se houver' },
    { id: 'remada',            nome: 'Remada curvada ou serrote',      series: 3, reps: [8, 12] },
    { id: 'remada-maquina',    nome: 'Remada máquina (pegada aberta)', series: 2, reps: [10, 12] },
    { id: 'crucifixo-inverso', nome: 'Crucifixo inverso (posterior)',  series: 2, reps: [12, 20] },
    { id: 'rosca-direta',      nome: 'Rosca direta (barra reta/W)',    series: 2, reps: [8, 12] },
    { id: 'rosca-martelo',     nome: 'Rosca martelo (halteres)',       series: 2, reps: [10, 15] },
  ]},
  C: { nome: 'Treino C', foco: 'Pernas e core', ex: [
    { id: 'agachamento', nome: 'Agachamento livre (ou hack)',      series: 3, reps: [6, 10] },
    { id: 'stiff',       nome: 'Stiff (barra ou halteres)',        series: 2, reps: [8, 12] },
    { id: 'extensora',   nome: 'Cadeira extensora',                series: 2, reps: [10, 15] },
    { id: 'flexora',     nome: 'Mesa ou cadeira flexora',          series: 2, reps: [10, 15] },
    { id: 'panturrilha', nome: 'Panturrilha (em pé ou leg press)', series: 3, reps: [10, 15], obs: 'pausa de 1s embaixo' },
    { id: 'abdominal',   nome: 'Abdominal na polia ou supra',      series: 2, reps: [10, 15] },
  ]},
};
const ORDEM = ['A', 'B', 'C'];
const META = { academia: 3, corrida: 1 };
const KEY = 'treinohoje:v1';
const TEMA_KEY = 'treinohoje:tema';

/* ---------- dados ---------- */
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.sessoes)) return Object.assign({ rascunhos: {} }, d); }catch(e){}
  return { sessoes: [], rascunhos: {} };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
let db = load();
let aba = 'hoje';
let tipoSel = null;
let pedidoInstalar = null;

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const fmtNum = n => String(Math.round(n * 10) / 10).replace('.', ',');
const fmtData = (iso, opt = { day: '2-digit', month: '2-digit' }) => new Date(iso).toLocaleDateString('pt-BR', opt);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICON_UP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

function proximo(){
  const g = db.sessoes.filter(s => s.tipo !== 'corrida');
  if(!g.length) return 'A';
  return ORDEM[(ORDEM.indexOf(g[g.length - 1].tipo) + 1) % ORDEM.length];
}
function ultimo(exId){
  for(let i = db.sessoes.length - 1; i >= 0; i--){
    const s = db.sessoes[i];
    if(s.ex && s.ex[exId] && s.ex[exId].length) return { data: s.data, sets: s.ex[exId] };
  }
  return null;
}
function segunda(d){ const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function pace(km, min){
  if(!km || !min) return null;
  const p = min / km; let m = Math.floor(p); let s = Math.round((p - m) * 60);
  if(s === 60){ m++; s = 0; }
  return `${m}:${String(s).padStart(2, '0')}`;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }

function calendario(){
  const d = new Date();
  const mes = d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  const sem = d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  const longa = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="cal" role="img" aria-label="Hoje, ${longa}"><div class="m">${mes}</div><div class="d">${d.getDate()}</div><div class="w">${sem}</div></div>`;
}

/* ---------- telas ---------- */
function telaHoje(){
  const prox = proximo();
  const t = tipoSel || prox;
  const seg = [...ORDEM, 'corrida'].map(k =>
    `<button type="button" role="tab" aria-selected="${k === t}" data-tipo="${k}" class="${k === t ? 'on' : ''}">${k === 'corrida' ? 'Corrida' : k}${k === prox ? '<span class="dot" aria-label="próximo da rotação"></span>' : ''}</button>`
  ).join('');
  return `<div class="seg" role="tablist" aria-label="Treino">${seg}</div>` + (t === 'corrida' ? telaCorrida() : telaTreino(t, t === prox));
}

function telaTreino(t, ehProx){
  const p = PLANO[t];
  const rd = db.rascunhos[t] || (db.rascunhos[t] = { ex: {} });
  const totalSeries = p.ex.reduce((a, e) => a + e.series, 0);
  const cards = p.ex.map(e => {
    const sets = rd.ex[e.id] || (rd.ex[e.id] = Array.from({ length: e.series }, () => ({ kg: '', reps: '' })));
    const last = ultimo(e.id);
    let ult = 'Primeira vez', hint = '';
    if(last){
      const kgs = last.sets.map(s => s.kg).filter(Boolean);
      const mesmoKg = kgs.length && kgs.every(k => k === kgs[0]);
      ult = `Última · ${fmtData(last.data)} · ` + (mesmoKg
        ? `${esc(kgs[0])} kg × ${last.sets.map(s => esc(s.reps)).join(', ')}`
        : last.sets.map(s => `${s.kg ? esc(s.kg) + '×' : ''}${esc(s.reps)}`).join(', '));
      if(last.sets.length >= e.series && last.sets.every(s => (num(s.reps) ?? 0) >= e.reps[1]))
        hint = `<p class="hint">${ICON_UP}Topo da faixa: suba a carga</p>`;
    }
    const linhas = sets.map((s, i) => {
      const ls = last && last.sets[i];
      const rot = `${esc(e.nome)}, série ${i + 1}`;
      return `<div class="set"><span class="n">${String(i + 1).padStart(2, '0')}</span>
        <label class="field"><input inputmode="decimal" aria-label="${rot}, carga" data-ex="${e.id}" data-i="${i}" data-f="kg" value="${esc(s.kg)}" placeholder="${ls && ls.kg ? esc(ls.kg) : '—'}"><small>kg</small></label>
        <label class="field"><input inputmode="numeric" aria-label="${rot}, repetições" data-ex="${e.id}" data-i="${i}" data-f="reps" value="${esc(s.reps)}" placeholder="${ls ? esc(ls.reps) : e.reps[0] + '–' + e.reps[1]}"><small>reps</small></label>
      </div>`;
    }).join('');
    return `<section class="card">
      <div class="ex-head"><h2>${esc(e.nome)}</h2><span class="ex-meta">${e.series} × ${e.reps[0]}–${e.reps[1]}</span></div>
      <p class="ultima">${ult}${e.obs ? ' · ' + esc(e.obs) : ''}</p>${hint}
      <div class="sets">${linhas}</div></section>`;
  }).join('');
  return `<div class="cab"><div>
      <p class="rot">${ehProx ? 'Treino de hoje' : 'Fora da rotação'}</p>
      <h1>${p.nome}</h1><p class="foco">${p.foco}</p>
    </div>${calendario()}</div>
    <div class="sec"><span>Exercícios</span><span>${p.ex.length} · ${totalSeries} séries · 1–2 da falha</span></div>
    <div class="lista-ex">${cards}</div>
    <button type="button" class="btn" data-acao="concluir" data-t="${t}">Concluir treino</button>`;
}

function telaCorrida(){
  const rd = db.rascunhos.corrida || (db.rascunhos.corrida = { km: '', min: '', sens: '' });
  const p = pace(num(rd.km), num(rd.min));
  const sens = ['Leve', 'Moderada', 'Puxada'].map(s => `<button type="button" class="chip ${rd.sens === s ? 'on' : ''}" aria-pressed="${rd.sens === s}" data-sens="${s}">${s}</button>`).join('');
  return `<div class="cab"><div><p class="rot">Cardio</p><h1>Corrida</h1><p class="foco">Ritmo confortável</p></div>${calendario()}</div>
    <div class="sec"><span>Registro</span></div>
    <section class="card">
      <div class="grid2">
        <div><label class="lb" for="run-km">Distância</label><span class="field"><input id="run-km" inputmode="decimal" data-run="km" value="${esc(rd.km)}" placeholder="0"><small>km</small></span></div>
        <div><label class="lb" for="run-min">Tempo</label><span class="field"><input id="run-min" inputmode="decimal" data-run="min" value="${esc(rd.min)}" placeholder="0"><small>min</small></span></div>
      </div>
      <p class="pace" id="pace">Pace <b>${p ? p + ' /km' : '—'}</b></p>
      <p class="lb" style="margin-top:16px">Esforço</p><div class="chips">${sens}</div>
    </section>
    <button type="button" class="btn" data-acao="concluir-corrida">Salvar corrida</button>`;
}

function telaSemana(){
  const ini = segunda(new Date());
  const fim = new Date(ini); fim.setDate(fim.getDate() + 7);
  const daSemana = db.sessoes.filter(s => { const d = new Date(s.data); return d >= ini && d < fim; });
  const acad = daSemana.filter(s => s.tipo !== 'corrida').length;
  const corr = daSemana.filter(s => s.tipo === 'corrida');
  const km = corr.reduce((a, s) => a + (num(s.corrida?.km) || 0), 0);
  const nomes = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const hj = (new Date().getDay() + 6) % 7;
  const dias = nomes.map((n, i) => {
    const doDia = daSemana.filter(s => (new Date(s.data).getDay() + 6) % 7 === i);
    const marca = doDia.map(s => s.tipo === 'corrida' ? '<b class="r">R</b>' : `<b>${s.tipo}</b>`).join('') || '<b>&nbsp;</b>';
    return `<div class="dia ${i === hj ? 'hj' : ''}"><small>${n}</small>${marca}</div>`;
  }).join('');
  let linhas = '';
  for(let w = 0; w < 8; w++){
    const a = new Date(ini); a.setDate(a.getDate() - 7 * w);
    const b = new Date(a); b.setDate(b.getDate() + 7);
    const ss = db.sessoes.filter(s => { const d = new Date(s.data); return d >= a && d < b; });
    const g = ss.filter(s => s.tipo !== 'corrida').length;
    const k = ss.filter(s => s.tipo === 'corrida').reduce((x, s) => x + (num(s.corrida?.km) || 0), 0);
    linhas += `<tr><td>${fmtData(a)}</td>
      <td>${g}/${META.academia}<div class="bar"><i style="width:${Math.min(100, g / META.academia * 100)}%"></i></div></td>
      <td class="num">${k ? fmtNum(k) + ' km' : '—'}</td></tr>`;
  }
  return `<div class="cab"><div><p class="rot">Meta: ${META.academia}× academia · ${META.corrida}× corrida</p><h1>Semana</h1></div>${calendario()}</div>
    <div class="sec"><span>Esta semana</span></div>
    <div class="stats">
      <div class="stat"><b>${acad}/${META.academia}</b><span>academia</span></div>
      <div class="stat"><b>${corr.length}/${META.corrida}</b><span>corrida</span></div>
      <div class="stat"><b>${km ? fmtNum(km) : '0'}</b><span>km</span></div>
    </div>
    <div class="sec"><span>Dias</span><span>R = corrida</span></div><div class="dias">${dias}</div>
    <div class="sec"><span>Últimas 8 semanas</span></div>
    <div class="card"><table><tr><th>Semana de</th><th>Academia</th><th class="num">Corrida</th></tr>${linhas}</table></div>`;
}

function nomeEx(id){ for(const k of ORDEM){ const e = PLANO[k].ex.find(x => x.id === id); if(e) return e.nome; } return id; }

function telaHistorico(){
  const cab = `<div class="cab"><div><p class="rot">${db.sessoes.length} registros</p><h1>Histórico</h1></div>${calendario()}</div>`;
  if(!db.sessoes.length) return cab + `<p class="vazio">Nenhum treino registrado ainda.</p>`;
  const itens = db.sessoes.slice().reverse().map(s => {
    const data = fmtData(s.data, { weekday: 'short', day: '2-digit', month: '2-digit' });
    let tit, corpo;
    if(s.tipo === 'corrida'){
      const c = s.corrida || {};
      const p = pace(num(c.km), num(c.min));
      tit = `Corrida · ${c.km ? esc(c.km) + ' km' : ''}`;
      corpo = `<p><span>Tempo</span> ${c.min ? esc(c.min) + ' min' : '—'}</p><p><span>Pace</span> ${p ? p + ' /km' : '—'}</p><p><span>Esforço</span> ${esc(c.sens) || '—'}</p>`;
    } else {
      tit = `${PLANO[s.tipo]?.nome || s.tipo} · ${PLANO[s.tipo]?.foco || ''}`;
      corpo = Object.entries(s.ex || {}).map(([id, sets]) =>
        `<p>${esc(nomeEx(id))}<br><span>${sets.map(x => (x.kg ? esc(x.kg) + ' kg × ' : '') + esc(x.reps)).join(' · ')}</span></p>`).join('');
    }
    return `<details class="card"><summary><span class="h-tit">${tit}</span><span class="h-data">${data}</span></summary>
      <div class="h-body">${corpo}<button type="button" class="del" data-del="${s.id}">Excluir registro</button></div></details>`;
  }).join('');
  return cab + `<div class="sec"><span>Mais recentes</span></div>${itens}`;
}

function telaPlano(){
  const blocos = ORDEM.map(k => {
    const p = PLANO[k];
    return `<div><div class="sec"><span>${p.nome}</span><span>${p.foco}</span></div><div class="card"><ul class="plano">${
      p.ex.map(e => `<li>${esc(e.nome)}<span>${e.series} × ${e.reps[0]}–${e.reps[1]}</span></li>`).join('')}</ul></div></div>`;
  }).join('');
  return `<div class="cab"><div><p class="rot">Rotação A → B → C</p><h1>Plano</h1></div>${calendario()}</div>
    <div class="plano-grid">${blocos}</div>
    <div class="plano-grid">
      <div><div class="sec"><span>Método</span></div>
        <div class="card txt">
          <p><b>Séries de trabalho:</b> 2–3 por exercício, até 1–2 repetições da falha. Aquecimento não conta.</p>
          <p><b>Progressão dupla:</b> ao completar o topo da faixa em todas as séries, suba a carga (~2,5–5%) e volte ao início da faixa.</p>
          <p><b>Descanso:</b> 2–3 min nos compostos, 1–2 min nos isolados.</p>
        </div></div>
      <div class="instalar" id="instalarBox"><div class="sec"><span>Instalar</span></div>
        <div class="card txt"><p>Ícone na tela inicial e funcionamento sem internet.</p>
          <button type="button" class="btn sec-btn" data-acao="instalar">Instalar app</button></div></div>
      <div><div class="sec"><span>Backup</span></div>
        <div class="card txt">
          <p>Os registros ficam neste navegador. Exporte de vez em quando para não perder ao trocar de aparelho.</p>
          <button type="button" class="btn sec-btn" data-acao="exportar">Exportar backup</button>
          <button type="button" class="btn sec-btn" data-acao="importar" style="margin-top:8px">Importar backup</button>
          <input type="file" id="arq" accept="application/json,.json" hidden>
        </div></div>
    </div>`;
}

function render(){
  const telas = { hoje: telaHoje, semana: telaSemana, historico: telaHistorico, plano: telaPlano };
  $('#app').innerHTML = telas[aba]();
  document.querySelectorAll('nav.menu button').forEach(b => {
    const on = b.dataset.aba === aba;
    b.classList.toggle('on', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const ib = $('#instalarBox'); if(ib) ib.style.display = pedidoInstalar ? 'block' : 'none';
}

/* ---------- tema ---------- */
function tema(){
  try{ const t = localStorage.getItem(TEMA_KEY); return t === 'escuro' ? 'escuro' : 'claro'; }catch(e){ return 'claro'; }
}
function aplicarTema(t){
  document.documentElement.dataset.theme = t;
  $('#themeColor').setAttribute('content', t === 'escuro' ? '#1c1c1b' : '#f2ece0');
  document.querySelectorAll('.tema button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === t)));
  try{ localStorage.setItem(TEMA_KEY, t); }catch(e){}
}
document.querySelector('.tema').addEventListener('click', e => {
  const b = e.target.closest('button[data-tema]'); if(b) aplicarTema(b.dataset.tema);
});

/* ---------- eventos ---------- */
document.querySelector('nav.menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-aba]'); if(!b) return;
  aba = b.dataset.aba; render(); window.scrollTo(0, 0);
});

$('#app').addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.ex){
    const t = tipoSel || proximo();
    db.rascunhos[t].ex[el.dataset.ex][+el.dataset.i][el.dataset.f] = el.value.trim();
    save();
  } else if(el.dataset.run){
    db.rascunhos.corrida[el.dataset.run] = el.value.trim(); save();
    const p = pace(num(db.rascunhos.corrida.km), num(db.rascunhos.corrida.min));
    $('#pace').innerHTML = `Pace <b>${p ? p + ' /km' : '—'}</b>`;
  }
});

$('#app').addEventListener('click', e => {
  const el = e.target.closest('button'); if(!el) return;
  if(el.dataset.tipo){ tipoSel = el.dataset.tipo === proximo() ? null : el.dataset.tipo; render(); return; }
  if(el.dataset.sens){ db.rascunhos.corrida.sens = db.rascunhos.corrida.sens === el.dataset.sens ? '' : el.dataset.sens; save(); render(); return; }
  if(el.dataset.del){
    if(confirm('Excluir este registro?')){ db.sessoes = db.sessoes.filter(s => String(s.id) !== el.dataset.del); save(); render(); }
    return;
  }
  const acao = el.dataset.acao;
  if(acao === 'concluir'){
    const t = el.dataset.t; const rd = db.rascunhos[t]; const ex = {};
    for(const [id, sets] of Object.entries(rd.ex)){
      const feitos = sets.filter(s => s.reps !== '').map(s => ({ kg: s.kg, reps: s.reps }));
      if(feitos.length) ex[id] = feitos;
    }
    if(!Object.keys(ex).length){ toast('Preencha ao menos uma série'); return; }
    db.sessoes.push({ id: Date.now(), data: new Date().toISOString(), tipo: t, ex });
    delete db.rascunhos[t]; tipoSel = null; save(); render(); window.scrollTo(0, 0);
    toast(`${PLANO[t].nome} salvo`);
  }
  if(acao === 'concluir-corrida'){
    const rd = db.rascunhos.corrida;
    if(!num(rd.km)){ toast('Informe a distância'); return; }
    db.sessoes.push({ id: Date.now(), data: new Date().toISOString(), tipo: 'corrida', corrida: { ...rd } });
    delete db.rascunhos.corrida; tipoSel = null; save(); render(); window.scrollTo(0, 0);
    toast('Corrida salva');
  }
  if(acao === 'exportar'){
    const blob = new Blob([JSON.stringify({ sessoes: db.sessoes }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `treinohoje-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  }
  if(acao === 'importar') $('#arq').click();
  if(acao === 'instalar' && pedidoInstalar){ pedidoInstalar.prompt(); pedidoInstalar.userChoice.finally(() => { pedidoInstalar = null; render(); }); }
});

$('#app').addEventListener('change', e => {
  if(e.target.id !== 'arq' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.sessoes)) throw 0;
      if(!confirm(`Substituir os registros atuais por ${d.sessoes.length} registros do backup?`)) return;
      db.sessoes = d.sessoes.sort((a, b) => new Date(a.data) - new Date(b.data));
      save(); render(); toast('Backup importado');
    }catch(err){ toast('Arquivo inválido'); }
  };
  r.readAsText(e.target.files[0]);
});

/* atualiza a data ao voltar para o app num outro dia */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && !document.activeElement?.matches('input')) render();
});

/* ---------- app instalável ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if(aba === 'plano') render(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

aplicarTema(tema());
render();
</script>
</body>
</html>
